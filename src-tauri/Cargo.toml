[package]
name = "legal-annotator-desktop"
version = "0.1.0"
description = "Standalone Legal Annotator Desktop (Tauri 2 + Native PDFium + Local SQLite Mirror)"
authors = ["Legal Annotator"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
rfd = "0.15"
sha2 = "0.10"
hex = "0.4"
